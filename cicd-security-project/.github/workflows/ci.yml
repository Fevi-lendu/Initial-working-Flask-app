name: CI Pipeline

on: [push]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: |
          cd node-app
          npm install

      - name: Node Tests
        run: |
          cd node-app
          npm test

      - name: ESLint Static Analysis
        run: |
          cd node-app
          npm run lint

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          cd python-app
          pip install -r requirements.txt

      - name: Python Tests
        run: |
          cd python-app
          pytest

      - name: Flake8 Static Analysis
        run: |
          cd python-app
          flake8 .

      - name: Run Node App
        run: |
          cd node-app
          npm start &

      - name: Run Python App
        run: |
          cd python-app
          python app.py &

      - name: OWASP ZAP Baseline Scan (Node)
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:3000'

      - name: OWASP ZAP Baseline Scan (Python)
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:5000'